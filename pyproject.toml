[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-runtime"
version = "0.1.0"
description = "A crash-safe agent runtime: append-only event log, resume without repeating tools, approvals, compaction"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
agent-runtime-migrate = "runtime.migrate:main"

[tool.setuptools.packages.find]
include = ["runtime*"]

[tool.setuptools.package-data]
"runtime.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
